name: Build and deploy Caledonia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: caledoniagrove20261004
  ACR_LOGIN_SERVER: caledoniagrove20261004.azurecr.io
  IMAGE_NAME: caledonia
  RESOURCE_GROUP: Caledonia_group
  WEBAPP_NAME: Caledonia

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        env:
          IMAGE: caledoniagrove20261004.azurecr.io/caledonia:${{ github.sha }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Update App Service image
        env:
          IMAGE: caledoniagrove20261004.azurecr.io/caledonia:${{ github.sha }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-image-name "$IMAGE" \
            --output none
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --output none
